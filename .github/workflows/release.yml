name: Build and release AroFi Support

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arofi-support-release
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch exact AroFi brand icon
        run: |
          mkdir -p assets
          curl -fsSL https://arofi.net/brand-assets/arofi-app-icon.png -o assets/arofi_app_icon.png
      - name: Generate mobile platform shells and branding
        run: |
          flutter create . --platforms=android,ios --project-name arofi_support --org com.arofi
          python3 tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Verify
        run: |
          flutter analyze
          flutter test
      - name: Build Android release files
        run: |
          flutter build apk --release
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/AroFi-Support-v1.0.0-universal.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/AroFi-Support-v1.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/AroFi-Support-v1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/AroFi-Support-v1.0.0-x86_64.apk
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab release/AroFi-Support-v1.0.0.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch exact AroFi brand icon
        run: |
          mkdir -p assets
          curl -fsSL https://arofi.net/brand-assets/arofi-app-icon.png -o assets/arofi_app_icon.png
      - name: Generate mobile platform shells and branding
        run: |
          flutter create . --platforms=android,ios --project-name arofi_support --org com.arofi
          python3 tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build unsigned iOS validation application
        run: |
          flutter build ios --release --no-codesign
          mkdir -p ios-release
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ios-release/AroFi-Support-iOS-unsigned-v1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ios-release/*

  release:
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Download iOS artifact when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-unsigned
          path: ios-release
      - name: Publish v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AroFi Support v1.0.0
          body: |
            First AroFi Support agent application release.

            Android includes a universal APK, architecture-specific APKs and an Android App Bundle. Production Play Store signing should use the permanent AroFi Support upload key.

            iOS artifacts from CI are unsigned validation builds until Apple Developer signing is configured.
          files: |
            release/*
            ios-release/*
          fail_on_unmatched_files: false
